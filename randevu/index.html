<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f4f5" />
  <meta name="description" content="Kastamonu Diş Hekimi Barış Berkay Güldamlası kliniğinden hızlı ve kolay bir şekilde online diş hekimi randevu talebinizi oluşturun." />
  <title>Online Randevu | Diş Hekimi Barış Berkay Güldamlası</title>
  <meta property="og:title" content="Online Randevu | Diş Hekimi Barış Berkay Güldamlası" />
  <meta property="og:description" content="Diş Hekimi Barış Berkay Güldamlası için online randevu talebinizi oluşturun." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://randevu.dtberkayguldamlasi.com/" />
  <meta property="og:image" content="https://dtberkayguldamlasi.com/IMG/baris-berkay-guldamlasi.jpg" />

  <link rel="canonical" href="https://randevu.dtberkayguldamlasi.com/" />
  <link rel="icon" href="https://dtberkayguldamlasi.com/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" />
  <link rel="preconnect" href="https://online.dentsoft.com.tr" />

  <style>
    :root {
      --color-text: #2b2e33;
      --color-muted: #6a6f76;
      --color-surface: #f3f4f5;
      --color-border: #e1e3e6;

      /* Header height = logo + vertical padding + border; the booking
         iframe fills the rest of the viewport. */
      --logo-width: 214px;
      --logo-height: 72px;
      --logo-padding-inline: 23px;
      --header-padding-block: 22px;
      --header-padding-inline: 36px;
      --header-height: calc(var(--logo-height) + 2 * var(--header-padding-block) + 1px);

      color-scheme: light;
      background: var(--color-surface);
      color: var(--color-text);
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: var(--header-padding-block) var(--header-padding-inline);
      border-bottom: 1px solid var(--color-border);
      background: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand img {
      display: block;
      width: var(--logo-width);
      height: var(--logo-height);
      padding-inline: var(--logo-padding-inline);
      object-fit: contain;
    }

    h1,
    .home-link {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .home-link {
      flex-shrink: 0;
    }

    .booking-frame {
      display: block;
      width: 100%;
      height: calc(100vh - var(--header-height));
      height: calc(100dvh - var(--header-height));
      min-height: 600px;
      border: 0;
      background: #fff;
    }

    .fallback {
      margin: 0;
      padding: 12px 20px;
      color: var(--color-muted);
      font-size: 13px;
      text-align: center;
    }

    .fallback a {
      color: var(--color-text);
    }

    @media (max-width: 1150px) {
      :root {
        --header-padding-block: 20px;
        --header-padding-inline: 28px;
      }
    }

    @media (max-width: 760px) {
      :root {
        --logo-width: 155px;
        --logo-height: 52px;
        --logo-padding-inline: 16px;
        --header-padding-block: 14px;
        --header-padding-inline: 20px;
      }
    }

    @media (max-width: 560px) {
      .page-header {
        gap: 12px;
      }

      .brand {
        gap: 10px;
      }
    }

    @media (max-width: 380px) {
      .brand {
        gap: 6px;
      }

      h1 {
        max-width: 60px;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <a href="https://dtberkayguldamlasi.com/" aria-label="Barış Berkay Güldamlası ana sayfa">
        <img src="https://dtberkayguldamlasi.com/IMG/logo.png" alt="Barış Berkay Güldamlası Diş Hekimi" />
      </a>
      <h1>Online Randevu</h1>
    </div>
    <a class="home-link" href="https://dtberkayguldamlasi.com/">Ana sayfa</a>
  </header>

  <main>
    <iframe
      class="booking-frame"
      src="https://online.dentsoft.com.tr/#4150577152"
      title="Diş Hekimi Barış Berkay Güldamlası online randevu formu"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <p class="fallback">
      Randevu formu görünmüyor mu?
      <a href="https://online.dentsoft.com.tr/#4150577152" target="_blank" rel="noopener noreferrer">Randevu sayfasını ayrı pencerede açın.</a>
    </p>
  </main>
</body>
</html>
